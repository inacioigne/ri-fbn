networks:
  fbn-net:
    # ipam:
    #   config:
    #     - subnet: 172.23.0.0/16
    # external: false
services:
  # DSpace (backend) webapp container
  api:
    container_name: fbn-api
    env_file:
      - .env
    environment:
      dspace__P__name: "RI FBN"
      db__P__url: ${db__P__url:-jdbc:postgresql://fbn-db:5432/dspace}
      solr__P__server: ${solr__P__server:-http://fbn-solr:8983/solr}
      matomo__P__tracker__P__url: ${matomo__P__tracker__P__url:-http://matomo}
      proxies__P__trusted__P__ipranges: ${proxies__P__trusted__P__ipranges:-172.23.0}
      LOGGING_CONFIG: ${LOGGING_CONFIG:-/dspace/config/log4j2-container.xml}
      TZ: America/Manaus
    image: "docker.io/fbn/api:${DSPACE_VERSION}"
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
    - dspacedb
    - dspacesolr
    networks:
      - fbn-net
    ports:
    - published: 8081
      target: 8080

    volumes:
    - assetstore:/dspace/assetstore
    - ./api/dspace/config:/dspace/config
    - /home/fbn/GeoLite2-City.mmdb:/dspace/GeoLite2-City.mmdb
    entrypoint:
    - /bin/bash
    - '-c'
    - |
      while (!</dev/tcp/dspacedb/5432) > /dev/null 2>&1; do sleep 1; done;
      /dspace/bin/dspace database migrate
      java -jar /dspace/webapps/server-boot.jar
  # DSpace PostgreSQL database container
  dspacedb:
    container_name: fbn-db
    # Uses the base PostgreSQL image
    image: "docker.io/postgres:${POSTGRES_VERSION:-15}"
    env_file:
      - .env
    environment:
      PGDATA: /pgdata
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Manaus
    networks:
      fbn-net:
    expose:
      - 5432
    # ports:
    # - published: 5432
    #   target: 5432
    volumes:
    - pgdata:/pgdata
  # DSpace Solr container
  dspacesolr:
    container_name: fbn-solr
    env_file:
      - .env
    image: "fbn/dspace-solr:${DSPACE_VERSION}"
    build:
      context: ./api/dspace/src/main/docker/dspace-solr/
      additional_contexts:
        solrconfigs: ./api/dspace/solr/
      args:
        SOLR_VERSION: "${SOLR_VER:-9.8}"
    networks:
      fbn-net:
    # ports:
    # - published: 8983
    #   target: 8983
    working_dir: /var/solr/data
    volumes:
    # Keep Solr data directory between reboots
    - solr_data:/var/solr/data
    user: root
    entrypoint:
    - /bin/bash
    - '-c'
    - |
      init-var-solr
      precreate-core authority /opt/solr/server/solr/configsets/authority
      cp -r /opt/solr/server/solr/configsets/authority/* authority
      precreate-core oai /opt/solr/server/solr/configsets/oai
      cp -r /opt/solr/server/solr/configsets/oai/* oai
      precreate-core search /opt/solr/server/solr/configsets/search
      cp -r /opt/solr/server/solr/configsets/search/* search
      precreate-core statistics /opt/solr/server/solr/configsets/statistics
      cp -r /opt/solr/server/solr/configsets/statistics/* statistics
      precreate-core qaevent /opt/solr/server/solr/configsets/qaevent
      cp -r /opt/solr/server/solr/configsets/qaevent/* qaevent
      precreate-core suggestion /opt/solr/server/solr/configsets/suggestion
      cp -r /opt/solr/server/solr/configsets/suggestion/* suggestion
      precreate-core audit /opt/solr/server/solr/configsets/audit
      cp -r /opt/solr/server/solr/configsets/audit/* audit
      chown -R solr:solr /var/solr
      runuser -u solr -- solr-foreground
volumes:
  assetstore:
  pgdata:
  solr_data:
