networks:
  dockernet:

services:
  # Dspace UI
  ui:
     container_name: dspace-ui
     image: fbn/dspace-ui:${DSPACE_VERSION}-dist
     build: 
       context: .
      #  dockerfile: ui.dockerfile
       dockerfile: ./ui-dist.dockerfile
     env_file:
       - .env
     environment:
      - NODE_ENV=production
      - DSPACE_REST_SSL=true
      - DSPACE_REST_HOST=ri.fbnovas.edu.br
      - DSPACE_REST_PORT=443
      - DSPACE_REST_NAMESPACE=/server
     networks:
       - dockernet
     ports:
     - published: 4000
       target: 4000
     stdin_open: true
     tty: true
     restart: unless-stopped    
  # Dspace API
  api:
    env_file:
      - .env
    container_name: dspace-api      
    image: fbn/dspace-api:${DSPACE_VERSION}
    build: 
      context: .
      dockerfile: api.dockerfile
    
    depends_on:
      - dspacedb
      - dspacesolr
    networks:
      - dockernet
    ports:
      - published: 8080
        target: 8080
      - published: 8000
        target: 8000
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
    - assetstore:/dspace/assetstore
    - ./api/dspace/config:/dspace/config
    - /home/fbn/dbip-city-lite-2025-05.mmdb:/dspace/dbip-city-lite-2025-05.mmdb
    entrypoint:
    - /bin/bash
    - '-c'
    - |
      while (!</dev/tcp/dspacedb/5432) > /dev/null 2>&1; do sleep 1; done;
      /dspace/bin/dspace database migrate
      java -jar /dspace/webapps/server-boot.jar --dspace.dir=/dspace

  # Banco de Dados
  dspacedb:
    container_name: dspacedb
    image: fbn/dspacedb:${DSPACE_VERSION}
    env_file:
      - .env
    build: 
     context: ./docker/db/
     args:
      POSTGRES_VERSION: ${POSTGRES_VERSION}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    networks:
      dockernet:
    ports:
      - published: 5432
        target: 5432
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - pgdata:/pgdata

  # DSpace Solr
  dspacesolr:
    container_name: dspacesolr
    image: fbn/dspacesolr:${DSPACE_VERSION}
    env_file:
      - .env
    build:
      context: ./docker/solr/
      additional_contexts: 
        solrconfigs: ./api/dspace/solr
      args:
        SOLR_VERSION: ${SOLR_VERSION}
    
    networks:
      dockernet:
    ports:
      - published: 8983
        target: 8983
    stdin_open: true
    tty: true
    restart: unless-stopped
    working_dir: /var/solr/data
    volumes:
      - solr_data:/var/solr/data
    entrypoint:
    - /bin/bash
    - '-c'
    - |
      init-var-solr
      precreate-core authority /opt/solr/server/solr/configsets/authority
      cp -r /opt/solr/server/solr/configsets/authority/* authority
      precreate-core oai /opt/solr/server/solr/configsets/oai
      cp -r /opt/solr/server/solr/configsets/oai/* oai
      precreate-core search /opt/solr/server/solr/configsets/search
      cp -r /opt/solr/server/solr/configsets/search/* search
      precreate-core statistics /opt/solr/server/solr/configsets/statistics
      cp -r /opt/solr/server/solr/configsets/statistics/* statistics
      precreate-core qaevent /opt/solr/server/solr/configsets/qaevent
      cp -r /opt/solr/server/solr/configsets/qaevent/* qaevent
      precreate-core suggestion /opt/solr/server/solr/configsets/suggestion
      cp -r /opt/solr/server/solr/configsets/suggestion/* suggestion
      exec solr -f

volumes:
  assetstore:
  pgdata:
  solr_data: 